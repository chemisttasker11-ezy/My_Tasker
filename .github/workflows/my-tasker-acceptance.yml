name: My Tasker acceptance
on:
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'deploy/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'scripts/deploy-mytasker*.sh'
      - '.dockerignore'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/my-tasker-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit production and developer dependencies
        run: npm audit --audit-level=high
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep-invert '@auth-gate'
        env:
          VITE_DEMO_MODE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  auth-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise the real authenticated entry point with mocked transport
        run: npm run test:e2e -- tests/auth-gate.spec.ts
        env:
          VITE_DEMO_MODE: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-browser-report
          path: |
            playwright-report/
            test-results/
  django-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - name: Provide test-only secrets
        run: |
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "ADMIN_TOTP_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Validate Django configuration and migration model
        run: |
          python server/manage.py check
          python server/manage.py makemigrations --check --dry-run
        env:
          DEBUG: 'True'
      - run: python server/manage.py test accounts --verbosity 2
        env:
          DEBUG: 'True'
  django-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mytasker_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: mytasker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mytasker_test -d mytasker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: postgres://mytasker_test:test_only_password@127.0.0.1:5432/mytasker_ci
      DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - name: Provide test-only secrets
        run: |
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "ADMIN_TOTP_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Test Django schema and user isolation on PostgreSQL
        run: |
          python server/manage.py check
          python server/manage.py makemigrations --check --dry-run
          python server/manage.py test accounts --verbosity 2
  container-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject cross-environment deployment routes
        run: python3 scripts/check-deployment-isolation.py
      - name: Validate deployment shell scripts
        run: bash -n scripts/deploy-mytasker.sh scripts/deploy-mytasker-staging.sh scripts/smoke-mytasker.sh
      - name: Generate disposable Compose environment files
        run: |
          mkdir -p env
          printf '%s\n' 'MYTASKER_HOST=example.test' 'MYTASKER_DB_PASSWORD=ci-only-password' > env/ci-values.env
          cp env/ci-values.env env/mytasker.prod.env
          cp env/ci-values.env env/mytasker.staging.env
      - name: Validate production and staging Docker Compose
        run: |
          docker compose --env-file env/ci-values.env -f docker-compose.prod.yml config --quiet
          docker compose --env-file env/ci-values.env -f docker-compose.staging.yml config --quiet
      - name: Build exact production image
        run: docker build --tag mytasker-acceptance:ci --file Dockerfile .
      - name: Run Django checks inside production image
        env:
          DEBUG: 'True'
        run: |
          docker run --rm --entrypoint python \
            --env DEBUG=True \
            --env SECRET_KEY=ci-acceptance-key-for-test-only-not-live \
            --env ADMIN_TOTP_ENCRYPTION_KEY=ci-test-only \
            --env ALLOWED_HOSTS=localhost \
            --env DATABASE_URL=sqlite:////tmp/mytasker-test.sqlite3 \
            mytasker-acceptance:ci /app/server/manage.py check
      - name: Ensure the built image includes the bundled React UI
        run: |
          docker run --rm --entrypoint python mytasker-acceptance:ci \
            -c "from pathlib import Path; p=Path('/app/dist/index.html'); assert p.exists(); assert '/assets/' in p.read_text()"
