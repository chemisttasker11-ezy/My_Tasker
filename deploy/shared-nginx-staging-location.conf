# Include inside a NEW hostname's already-TLS-protected server block
# in the existing shared OVH Nginx container. Do not replace ChemistTasker's
# public, staging, API, or shared Nginx configurations.
client_max_body_size 5m;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_connect_timeout 15s;
proxy_read_timeout 65s;
location / {
    proxy_pass http://mytasker_backend_prod:8000;
}

add_header X-Robots-Tag "noindex, nofollow" always;
